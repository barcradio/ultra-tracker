name: Build & Release Ultra Tracker
on:
  push:
    tags:
      - v*.*.*

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [24]
        os: [windows-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - if: matrix.os == 'windows-latest'
        run: pnpm config set virtual-store-dir-max-length 80

      # - if: matrix.os == 'ubuntu-latest'
      #   run: sudo apt install ruby ruby-dev

      # - if: matrix.os == 'ubuntu-latest'
      #   run: sudo gem install fpm

      - name: Install Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Derive release version from tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag '${GITHUB_REF_NAME}'. Expected format: vX.Y.Z[-prerelease]"
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Sync package version for tagged release
        # electron-builder reads package.json version for app metadata and artifact names.
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.RELEASE_VERSION;fs.writeFileSync(p, JSON.stringify(j, null, 2)+'\n');"

      - name: Install Dependencies
        run: pnpm install

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build:linux

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: pnpm build:mac

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: pnpm build:win

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USE_SYSTEM_FPM: true
