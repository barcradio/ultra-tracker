name: Build & Release Ultra Tracker
on:
  push:
    tags:
      - v*.*.*

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  release:
    env:
      # electron-builder's GitHub publish provider requires a token even when the actual
      # release assets are uploaded later by action-gh-release.
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    runs-on: ${{ matrix.os }}
    strategy:
      # The Release step runs per leg; concurrent legs duplicate the draft.
      max-parallel: 1
      matrix:
        node-version: [24]
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - if: matrix.os == 'windows-latest'
        run: pnpm config set virtual-store-dir-max-length 80

      # electron-builder fetches its own fpm; install it here with USE_SYSTEM_FPM=true if that fails:
      # - if: matrix.os == 'ubuntu-latest'
      #   run: sudo apt install ruby ruby-dev
      # - if: matrix.os == 'ubuntu-latest'
      #   run: sudo gem install fpm

      - name: Install Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Derive release version from tag
        id: release
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Invalid tag '${GITHUB_REF_NAME}'. Expected format: vX.Y.Z, vX.Y.Z-alpha.N, or vX.Y.Z-beta.N"
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_NAME}" == *-alpha.* || "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            echo "UPDATE_CHANNEL=beta" >> "$GITHUB_ENV"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "UPDATE_CHANNEL=latest" >> "$GITHUB_ENV"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package version for tagged release
        # electron-builder reads package.json version for app metadata and artifact names.
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.RELEASE_VERSION;fs.writeFileSync(p, JSON.stringify(j, null, 2)+'\n');"

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --linux --publish never

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --publish never

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --win --publish never

      - name: Create beta update metadata
        if: env.UPDATE_CHANNEL == 'beta'
        shell: bash
        run: cp dist/latest.yml dist/beta.yml

      - name: Verify update channel metadata
        shell: bash
        run: |
          metadata_file_found=
          for metadata_file in dist/"${UPDATE_CHANNEL}"*.yml; do
            if [ -f "$metadata_file" ]; then
              metadata_file_found=true
              break
            fi
          done
          if [ -z "$metadata_file_found" ]; then
            echo "Missing ${UPDATE_CHANNEL} update metadata in dist"
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.release.outputs.is_prerelease }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
