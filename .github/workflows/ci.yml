name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Main Database
        id: test_main_database
        continue-on-error: true
        run: pnpm test:main:database

      - name: Test Main IPC
        id: test_main_ipc
        continue-on-error: true
        run: pnpm test:main:ipc

      - name: Test Preload
        id: test_preload
        continue-on-error: true
        run: pnpm test:preload

      - name: Test Renderer
        id: test_renderer
        continue-on-error: true
        run: pnpm test:renderer

      - name: Publish test checks
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const suites = [
              ["Test (main / database)", "${{ steps.test_main_database.outcome }}"],
              ["Test (main / ipc)", "${{ steps.test_main_ipc.outcome }}"],
              ["Test (preload)", "${{ steps.test_preload.outcome }}"],
              ["Test (renderer)", "${{ steps.test_renderer.outcome }}"]
            ];

            for (const [name, outcome] of suites) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                head_sha: context.sha,
                status: "completed",
                conclusion: outcome === "success" ? "success" : "failure",
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                output: {
                  title: name,
                  summary: `Vitest suite ${outcome}.`
                }
              });
            }

      - name: Verify test suites
        if: always()
        run: |
          test "${{ steps.test_main_database.outcome }}" = "success"
          test "${{ steps.test_main_ipc.outcome }}" = "success"
          test "${{ steps.test_preload.outcome }}" = "success"
          test "${{ steps.test_renderer.outcome }}" = "success"

      # Informational only: coverage % is a weak signal on its own and isn't a merge gate.
      - name: Coverage (non-blocking)
        if: always()
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
