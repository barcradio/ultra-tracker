name: CI

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test-main-database:
    name: Test (main / database)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Run test suite
        run: pnpm test:main:database

  test-main-ipc:
    name: Test (main / ipc)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Run test suite
        run: pnpm test:main:ipc

  test-preload:
    name: Test (preload)
    needs: [test-main-database, test-main-ipc]
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Run test suite
        run: pnpm test:preload

  test-renderer:
    name: Test (renderer)
    needs: test-preload
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Run test suite
        run: pnpm test:renderer

  coverage:
    name: Coverage (non-blocking)
    needs: test-renderer
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Enable Corepack (uses packageManager from package.json)
        run: corepack enable

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      # Informational only: coverage % is a weak signal on its own and isn't a merge gate.
      - name: Run coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
