appId: barcradio.ultra-tracker
productName: ultra-tracker
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: ultra-tracker
  icon: icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  # @electron/universal refuses to merge byte-identical prebuilds unless they are declared.
  x64ArchFiles: "**/better-sqlite3/prebuilds/**"
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # No Developer ID, so sign ad-hoc; library validation rejects that, hence no hardened runtime.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # A directory of NxN.png under build/, so every size lands in hicolor. A wrong path fails silently.
  icon: icons
  # 64-bit only, matching Windows and macOS. Pi 4/5 run arm64.
  target:
    - target: appimage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  maintainer: BARC <no-reply@barconline.org>
  category: Utility
  # Debian renders an empty Description without a synopsis.
  synopsis: Track athlete times in ultra marathons
  # Matches the .desktop name to StartupWMClass, which is how a window resolves to its icon.
  syncDesktopName: true
appImage:
  # Both AppImage legs build in the same job; without ${arch} the second overwrites the first.
  artifactName: ${name}-${version}-${arch}.${ext}
  # The static runtime no longer adds this, and an AppImage cannot ship a setuid sandbox helper.
  executableArgs:
    - --no-sandbox
# The static runtime: the legacy FUSE2 one needs libfuse2 and an unversioned libz.so.
toolsets:
  appimage: "1.0.2"
npmRebuild: false
publish:
  provider: github
  owner: barcradio
  repo: ultra-tracker
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
