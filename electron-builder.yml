appId: com.electron.app
productName: ultra-tracker
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: ultra-tracker
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # A single PNG installs only that one size into hicolor, which leaves panels
  # and menus scaling one oversized bitmap. Point at a directory of NxN.png so
  # every size is installed and each desktop can pick the right one.
  # Resolved relative to directories.buildResources (build/), so this is
  # build/icons. Getting the prefix wrong here fails silently: electron-builder
  # falls back to generating a partial set from icon.icns instead.
  icon: icons
  # 64-bit only, matching the Windows (x64) and macOS (universal) builds.
  # armv7l is dropped deliberately: a 32-bit Pi cannot usefully run this app,
  # and Pi 4/5 run 64-bit Raspberry Pi OS, which is arm64.
  target:
    - target: appimage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  maintainer: BARC <no-reply@barconline.org>
  category: Utility
  # Debian's Description field is "synopsis\n description". Without a synopsis
  # the whole field renders empty, which is a lintian error and shows as a
  # blank description in package managers.
  synopsis: Track athlete times in ultra marathons
  # Derive the .desktop filename from executableName so it matches
  # StartupWMClass and Electron's app_id, which is how desktop environments
  # associate a running window with its icon. Becomes the default in v27.
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
