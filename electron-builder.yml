appId: com.electron.app
productName: ultra-tracker
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: ultra-tracker
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # better-sqlite3 ships every platform's prebuilt .node, so these files are
  # byte-identical in the x64 and arm64 passes and @electron/universal refuses
  # to merge them unless they are declared here.
  x64ArchFiles: "**/better-sqlite3/prebuilds/**"
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # No Apple Developer ID available. Ad-hoc signing is still required: macOS
  # refuses to load an unsealed bundle on Apple Silicon. Hardened runtime is
  # off because it enforces library validation, which rejects ad-hoc-signed
  # frameworks for having no Team ID. Users clear quarantine on first launch.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: appimage
      arch:
        - x64
        - armv7l
        - arm64
    - target: deb
      arch:
        - x64
        - armv7l
        - arm64
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
